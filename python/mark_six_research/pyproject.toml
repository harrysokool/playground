[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mark-six-research"
version = "0.1.0"
description = "Reproducible statistical research on the Hong Kong Mark Six lottery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mark Six Research Project" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandera[pandas]>=0.21",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.scripts]
mark-six = "mark_six.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mark_six"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
